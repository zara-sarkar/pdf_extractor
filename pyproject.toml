[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-extractor"
version = "0.1.0"
description = "A hybrid PDF extraction CLI tool."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click",
    "pdfplumber",
    "pdf2image",
    "opencv-python-headless",
    "google-genai",
    "pillow",
    "tenacity",
    "python-dotenv"
]

[project.scripts]
nano-pdf = "nano_extractor.cli:cli"

# Explicitly discover only the nano_extractor package
[tool.setuptools.packages.find]
include = ["nano_extractor*"]